# Netlify serves the website; shop + admin requests are forwarded to the backend.
# 1) Deploy server.py on a Python host (see README-SHOP.md)
# 2) Replace YOUR-BACKEND-URL below with that host's address, e.g. https://rafgodwin-shop.onrender.com

[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND-URL/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://YOUR-BACKEND-URL/uploads/:splat"
  status = 200
  force = true

[build]
  publish = "."
